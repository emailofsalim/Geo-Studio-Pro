<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <defs>
    <!-- Background Navy Blue Gradient -->
    <linearGradient id="bgNavyGrad192" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e4e7a" />
      <stop offset="35%" stop-color="#143c62" />
      <stop offset="80%" stop-color="#0c253f" />
      <stop offset="100%" stop-color="#071b2f" />
    </linearGradient>

    <!-- Subtle Bevel / Sheen Gradient -->
    <linearGradient id="borderSheen192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#478bc7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0e2f50" stop-opacity="0.6" />
    </linearGradient>

    <!-- Reticle Cyan-Blue Glow Gradient -->
    <linearGradient id="reticleGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bce4ff" />
      <stop offset="100%" stop-color="#8ecbf8" />
    </linearGradient>

    <!-- Center Orange Dot Gradient -->
    <radialGradient id="orangeCore192" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ff9138" />
      <stop offset="50%" stop-color="#ff6a00" />
      <stop offset="100%" stop-color="#c94100" />
    </radialGradient>
  </defs>

  <!-- App Rounded Base Container -->
  <rect width="192" height="192" rx="42" fill="url(#bgNavyGrad192)" />
  <rect x="1.5" y="1.5" width="189" height="189" rx="40.5" fill="none" stroke="url(#borderSheen192)" stroke-width="2" />

  <!-- Target & Globe Vector Graphic -->
  <g>
    <!-- Globe Outer Circle -->
    <circle cx="96" cy="96" r="55.5" fill="none" stroke="#8ecbf8" stroke-width="3" />

    <!-- Inner Longitude Meridians -->
    <ellipse cx="96" cy="96" rx="21" ry="55.5" fill="none" stroke="#8ecbf8" stroke-width="2.5" />
    <ellipse cx="96" cy="96" rx="40.5" ry="55.5" fill="none" stroke="#8ecbf8" stroke-width="2.5" />

    <!-- Upper Latitude Parallel Arc -->
    <path d="M 49.5 63.75 Q 96 74.25 142.5 63.75" fill="none" stroke="#8ecbf8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Lower Latitude Parallel Arc -->
    <path d="M 49.5 128.25 Q 96 117.75 142.5 128.25" fill="none" stroke="#8ecbf8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Crosshairs Reticle Main Axis Lines -->
    <!-- Horizontal Crosshair -->
    <line x1="27" y1="96" x2="165" y2="96" stroke="url(#reticleGrad192)" stroke-width="3.2" />
    <!-- Left End T-Cap -->
    <line x1="27" y1="87.75" x2="27" y2="104.25" stroke="url(#reticleGrad192)" stroke-width="3.2" stroke-linecap="round" />
    <!-- Right End T-Cap -->
    <line x1="165" y1="87.75" x2="165" y2="104.25" stroke="url(#reticleGrad192)" stroke-width="3.2" stroke-linecap="round" />

    <!-- Vertical Crosshair -->
    <line x1="96" y1="27" x2="96" y2="165" stroke="url(#reticleGrad192)" stroke-width="3.2" />
    <!-- Top End T-Cap -->
    <line x1="87.75" y1="27" x2="104.25" y2="27" stroke="url(#reticleGrad192)" stroke-width="3.2" stroke-linecap="round" />
    <!-- Bottom End T-Cap -->
    <line x1="87.75" y1="165" x2="104.25" y2="165" stroke="url(#reticleGrad192)" stroke-width="3.2" stroke-linecap="round" />

    <!-- Center Target Marker -->
    <!-- Outer White Ring -->
    <circle cx="96" cy="96" r="11" fill="#ffffff" stroke="#bce4ff" stroke-width="1.2" />
    <!-- Vibrant Orange Core Disc -->
    <circle cx="96" cy="96" r="8.6" fill="url(#orangeCore192)" stroke="#fa8732" stroke-width="0.8" />
    <!-- Specular Highlight -->
    <circle cx="94.2" cy="93.8" r="2" fill="#ffffff" opacity="0.6" />
  </g>
</svg>
