<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background Navy Blue Gradient -->
    <linearGradient id="bgFav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e4e7a" />
      <stop offset="50%" stop-color="#143c62" />
      <stop offset="100%" stop-color="#071b2f" />
    </linearGradient>

    <!-- Center Orange Dot Gradient -->
    <radialGradient id="orangeFav" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ff9b49" />
      <stop offset="50%" stop-color="#ff6a00" />
      <stop offset="100%" stop-color="#c94100" />
    </radialGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="14" fill="url(#bgFav)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#478bc7" stroke-width="1.2" stroke-opacity="0.7" />

  <!-- Target & Globe Vector Graphic (optimized for small favicon clarity) -->
  <g>
    <!-- Globe Outer Circle -->
    <circle cx="32" cy="32" r="18.5" fill="none" stroke="#8ecbf8" stroke-width="1.8" />

    <!-- Inner Longitude Meridians -->
    <ellipse cx="32" cy="32" rx="7" ry="18.5" fill="none" stroke="#8ecbf8" stroke-width="1.5" />
    <ellipse cx="32" cy="32" rx="13.5" ry="18.5" fill="none" stroke="#8ecbf8" stroke-width="1.5" />

    <!-- Upper Latitude Parallel Arc -->
    <path d="M 16.5 21.2 Q 32 24.8 47.5 21.2" fill="none" stroke="#8ecbf8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Lower Latitude Parallel Arc -->
    <path d="M 16.5 42.8 Q 32 39.2 47.5 42.8" fill="none" stroke="#8ecbf8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Crosshairs Reticle Main Axis Lines -->
    <!-- Horizontal Crosshair -->
    <line x1="9" y1="32" x2="55" y2="32" stroke="#bce4ff" stroke-width="2" />
    <!-- Left End T-Cap -->
    <line x1="9" y1="28.5" x2="9" y2="35.5" stroke="#bce4ff" stroke-width="2" stroke-linecap="round" />
    <!-- Right End T-Cap -->
    <line x1="55" y1="28.5" x2="55" y2="35.5" stroke="#bce4ff" stroke-width="2" stroke-linecap="round" />

    <!-- Vertical Crosshair -->
    <line x1="32" y1="9" x2="32" y2="55" stroke="#bce4ff" stroke-width="2" />
    <!-- Top End T-Cap -->
    <line x1="28.5" y1="9" x2="35.5" y2="9" stroke="#bce4ff" stroke-width="2" stroke-linecap="round" />
    <!-- Bottom End T-Cap -->
    <line x1="28.5" y1="55" x2="35.5" y2="55" stroke="#bce4ff" stroke-width="2" stroke-linecap="round" />

    <!-- Center Target Marker -->
    <circle cx="32" cy="32" r="4.8" fill="#ffffff" stroke="#bce4ff" stroke-width="0.8" />
    <circle cx="32" cy="32" r="3.7" fill="url(#orangeFav)" stroke="#fa8732" stroke-width="0.5" />
    <circle cx="31.2" cy="31.2" r="0.9" fill="#ffffff" opacity="0.75" />
  </g>
</svg>
