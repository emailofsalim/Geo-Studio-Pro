<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1c1a17" />
      <stop offset="60%" stop-color="#0e0d0c" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1a4" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#c9a063" />
      <stop offset="100%" stop-color="#916c2d" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#dfb86c" />
      <stop offset="75%" stop-color="#aa7c28" />
      <stop offset="100%" stop-color="#4d350b" />
    </linearGradient>

    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a063" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#c9a063" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c9a063" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filter for subtle gold bloom -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Base Container -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="#c9a063" stroke-width="6" stroke-opacity="0.35" />

  <!-- Geodetic Coordinate Polar Circles -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#c9a063" stroke-width="1.5" stroke-opacity="0.18" stroke-dasharray="4 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#c9a063" stroke-width="2" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="75" fill="none" stroke="#c9a063" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Latitude / Longitude Orthogonal Grid Crossbars -->
  <line x1="256" y1="46" x2="256" y2="466" stroke="url(#gridGlow)" stroke-width="2" />
  <line x1="46" y1="256" x2="466" y2="256" stroke="url(#gridGlow)" stroke-width="2" />

  <!-- Theodolite Compass Tick Marks -->
  <line x1="256" y1="56" x2="256" y2="76" stroke="url(#goldPrimary)" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="436" x2="256" y2="456" stroke="url(#goldPrimary)" stroke-width="4" stroke-linecap="round" />
  <line x1="56" y1="256" x2="76" y2="256" stroke="url(#goldPrimary)" stroke-width="4" stroke-linecap="round" />
  <line x1="436" y1="256" x2="456" y2="256" stroke="url(#goldPrimary)" stroke-width="4" stroke-linecap="round" />

  <!-- 45-degree Surveyor Sub-Ticks -->
  <line x1="115" y1="115" x2="130" y2="130" stroke="#c9a063" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round" />
  <line x1="397" y1="115" x2="382" y2="130" stroke="#c9a063" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round" />
  <line x1="115" y1="397" x2="130" y2="382" stroke="#c9a063" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round" />
  <line x1="397" y1="397" x2="382" y2="382" stroke="#c9a063" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round" />

  <!-- Cadastral Polygon Triangulation Vectors -->
  <polygon points="256,120 376,330 136,330" fill="none" stroke="#c9a063" stroke-width="2.5" stroke-opacity="0.3" />
  <polygon points="256,380 376,190 136,190" fill="none" stroke="#c9a063" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="3 5" />

  <!-- Stylized Monogram "BN" (BhuNex) Emblem with Reticle Prism Integration -->
  <g filter="url(#glow)">
    <!-- Primary 'B' & 'N' Interlocking Survey Beacon Form -->
    <!-- Left Vertical Pillar / Benchmark Mast -->
    <path d="M 160 148 L 192 148 L 192 364 L 160 364 Z" fill="url(#goldPrimary)" />
    
    <!-- Top Arc of B -->
    <path d="M 192 148 C 240 148 268 170 268 206 C 268 236 244 250 216 254 L 192 254 Z" fill="url(#goldAccent)" fill-opacity="0.9" />
    <path d="M 192 172 L 216 172 C 234 172 242 184 242 206 C 242 226 232 232 214 232 L 192 232 Z" fill="#121110" />

    <!-- Lower Traverse Diagonal / 'N' Geodetic Ray -->
    <path d="M 216 248 L 314 364 L 352 364 L 254 248 Z" fill="url(#goldPrimary)" />

    <!-- Right Vertical Station Tower -->
    <path d="M 320 148 L 352 148 L 352 364 L 320 364 Z" fill="url(#goldAccent)" />
  </g>

  <!-- Central High-Precision Reticle Prism Point -->
  <circle cx="256" cy="256" r="16" fill="#000000" stroke="url(#goldPrimary)" stroke-width="4" />
  <circle cx="256" cy="256" r="5" fill="#f5e1a4" />

  <!-- Geomatics Corner Coordinates Watermark -->
  <text x="56" y="470" font-family="'JetBrains Mono', monospace" font-size="16" fill="#c9a063" fill-opacity="0.45" letter-spacing="2">WGS84 • UTM</text>
  <text x="362" y="470" font-family="'JetBrains Mono', monospace" font-size="16" fill="#c9a063" fill-opacity="0.45" letter-spacing="2">BHUNEX</text>
</svg>
