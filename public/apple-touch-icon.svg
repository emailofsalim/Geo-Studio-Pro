<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%">
  <defs>
    <!-- Background Navy Blue Gradient -->
    <linearGradient id="bgNavyGrad180" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e4e7a" />
      <stop offset="35%" stop-color="#143c62" />
      <stop offset="80%" stop-color="#0c253f" />
      <stop offset="100%" stop-color="#071b2f" />
    </linearGradient>

    <!-- Subtle Bevel Gradient -->
    <linearGradient id="borderSheen180" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#478bc7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0e2f50" stop-opacity="0.6" />
    </linearGradient>

    <!-- Reticle Cyan-Blue Gradient -->
    <linearGradient id="reticleGrad180" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bce4ff" />
      <stop offset="100%" stop-color="#8ecbf8" />
    </linearGradient>

    <!-- Center Orange Dot Gradient -->
    <radialGradient id="orangeCore180" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ff9138" />
      <stop offset="50%" stop-color="#ff6a00" />
      <stop offset="100%" stop-color="#c94100" />
    </radialGradient>
  </defs>

  <!-- Apple Touch Base Container -->
  <rect width="180" height="180" rx="40" fill="url(#bgNavyGrad180)" />
  <rect x="1.5" y="1.5" width="177" height="177" rx="38.5" fill="none" stroke="url(#borderSheen180)" stroke-width="2" />

  <!-- Target & Globe Vector Graphic -->
  <g>
    <!-- Globe Outer Circle -->
    <circle cx="90" cy="90" r="52" fill="none" stroke="#8ecbf8" stroke-width="2.8" />

    <!-- Inner Longitude Meridians -->
    <ellipse cx="90" cy="90" rx="19.5" ry="52" fill="none" stroke="#8ecbf8" stroke-width="2.4" />
    <ellipse cx="90" cy="90" rx="38" ry="52" fill="none" stroke="#8ecbf8" stroke-width="2.4" />

    <!-- Upper Latitude Parallel Arc -->
    <path d="M 46.5 59.8 Q 90 69.6 133.5 59.8" fill="none" stroke="#8ecbf8" stroke-width="2.4" stroke-linecap="round" />

    <!-- Lower Latitude Parallel Arc -->
    <path d="M 46.5 120.2 Q 90 110.4 133.5 120.2" fill="none" stroke="#8ecbf8" stroke-width="2.4" stroke-linecap="round" />

    <!-- Crosshairs Reticle Main Axis Lines -->
    <!-- Horizontal Crosshair -->
    <line x1="25.5" y1="90" x2="154.5" y2="90" stroke="url(#reticleGrad180)" stroke-width="3" />
    <!-- Left End T-Cap -->
    <line x1="25.5" y1="82" x2="25.5" y2="98" stroke="url(#reticleGrad180)" stroke-width="3" stroke-linecap="round" />
    <!-- Right End T-Cap -->
    <line x1="154.5" y1="82" x2="154.5" y2="98" stroke="url(#reticleGrad180)" stroke-width="3" stroke-linecap="round" />

    <!-- Vertical Crosshair -->
    <line x1="90" y1="25.5" x2="90" y2="154.5" stroke="url(#reticleGrad180)" stroke-width="3" />
    <!-- Top End T-Cap -->
    <line x1="82" y1="25.5" x2="98" y2="25.5" stroke="url(#reticleGrad180)" stroke-width="3" stroke-linecap="round" />
    <!-- Bottom End T-Cap -->
    <line x1="82" y1="154.5" x2="98" y2="154.5" stroke="url(#reticleGrad180)" stroke-width="3" stroke-linecap="round" />

    <!-- Center Target Marker -->
    <!-- Outer White Ring -->
    <circle cx="90" cy="90" r="10.2" fill="#ffffff" stroke="#bce4ff" stroke-width="1.1" />
    <!-- Vibrant Orange Core Disc -->
    <circle cx="90" cy="90" r="8" fill="url(#orangeCore180)" stroke="#fa8732" stroke-width="0.8" />
    <!-- Specular Highlight -->
    <circle cx="88.3" cy="88" r="1.8" fill="#ffffff" opacity="0.6" />
  </g>
</svg>
