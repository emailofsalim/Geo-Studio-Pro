<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Navy Blue Gradient -->
    <linearGradient id="bgNavyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e4e7a" />
      <stop offset="35%" stop-color="#143c62" />
      <stop offset="80%" stop-color="#0c253f" />
      <stop offset="100%" stop-color="#071b2f" />
    </linearGradient>

    <!-- Subtle Bevel / Sheen Gradient -->
    <linearGradient id="borderSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#478bc7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#245a8a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0e2f50" stop-opacity="0.6" />
    </linearGradient>

    <!-- Reticle Cyan-Blue Glow / Color Gradient -->
    <linearGradient id="reticleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bce4ff" />
      <stop offset="100%" stop-color="#8ecbf8" />
    </linearGradient>

    <!-- Center Orange Dot Gradient -->
    <radialGradient id="orangeCore" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ff9138" />
      <stop offset="50%" stop-color="#ff6a00" />
      <stop offset="85%" stop-color="#eb5300" />
      <stop offset="100%" stop-color="#c94100" />
    </radialGradient>

    <!-- Subtle Drop Shadow Filter for Reticle -->
    <filter id="reticleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#030c14" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Rounded Base Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgNavyGrad)" />
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="url(#borderSheen)" stroke-width="4" />

  <!-- Target & Globe Vector Graphic -->
  <g filter="url(#reticleShadow)">
    <!-- Globe Outer Circle -->
    <circle cx="256" cy="256" r="148" fill="none" stroke="#8ecbf8" stroke-width="7.5" />

    <!-- Inner Longitude Meridians (Symmetrical Ellipses) -->
    <ellipse cx="256" cy="256" rx="56" ry="148" fill="none" stroke="#8ecbf8" stroke-width="6.5" />
    <ellipse cx="256" cy="256" rx="108" ry="148" fill="none" stroke="#8ecbf8" stroke-width="6.5" />

    <!-- Upper Latitude Parallel Arc -->
    <path d="M 132 170 Q 256 198 380 170" fill="none" stroke="#8ecbf8" stroke-width="6.5" stroke-linecap="round" />

    <!-- Lower Latitude Parallel Arc -->
    <path d="M 132 342 Q 256 314 380 342" fill="none" stroke="#8ecbf8" stroke-width="6.5" stroke-linecap="round" />

    <!-- Crosshairs Reticle Main Axis Lines -->
    <!-- Horizontal Crosshair -->
    <line x1="72" y1="256" x2="440" y2="256" stroke="url(#reticleGrad)" stroke-width="8.5" />
    <!-- Left End T-Cap -->
    <line x1="72" y1="234" x2="72" y2="278" stroke="url(#reticleGrad)" stroke-width="8.5" stroke-linecap="round" />
    <!-- Right End T-Cap -->
    <line x1="440" y1="234" x2="440" y2="278" stroke="url(#reticleGrad)" stroke-width="8.5" stroke-linecap="round" />

    <!-- Vertical Crosshair -->
    <line x1="256" y1="72" x2="256" y2="440" stroke="url(#reticleGrad)" stroke-width="8.5" />
    <!-- Top End T-Cap -->
    <line x1="234" y1="72" x2="278" y2="72" stroke="url(#reticleGrad)" stroke-width="8.5" stroke-linecap="round" />
    <!-- Bottom End T-Cap -->
    <line x1="234" y1="440" x2="278" y2="440" stroke="url(#reticleGrad)" stroke-width="8.5" stroke-linecap="round" />

    <!-- Center Target Marker -->
    <!-- Outer White Halo / Ring -->
    <circle cx="256" cy="256" r="29" fill="#ffffff" stroke="#bce4ff" stroke-width="2.5" />
    <!-- Vibrant Orange Core Disc -->
    <circle cx="256" cy="256" r="23" fill="url(#orangeCore)" stroke="#fa8732" stroke-width="1.5" />
    <!-- Specular Highlight for 3D depth -->
    <circle cx="251" cy="250" r="5" fill="#ffffff" opacity="0.5" />
  </g>
</svg>
